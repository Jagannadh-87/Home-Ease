name: homeease

services:
  mongo:
    image: mongo:7
    container_name: homeease-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db            # persistent database volume
    networks: [homeease-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-homeease}/backend:${IMAGE_TAG:-latest}
    container_name: homeease-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/homeease
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      # --- Build Inspector values (injected by Jenkins, defaults for local runs) ---
      APP_NAME: HomeEase
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_COMMIT: ${GIT_COMMIT:-local}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      DEPLOY_ENV: ${DEPLOY_ENV:-development}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-n/a}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [homeease-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    image: ${IMAGE_PREFIX:-homeease}/frontend:${IMAGE_TAG:-latest}
    container_name: homeease-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [homeease-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

networks:
  homeease-net:
